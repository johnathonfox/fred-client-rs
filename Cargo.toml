[package]
name = "fred-client-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Async Rust client for the Federal Reserve Economic Data (FRED) API"
repository = "https://github.com/johnathonfox/fred-client-rs"
keywords = ["fred", "economics", "finance", "api", "federal-reserve"]
categories = ["api-bindings", "finance"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1.4"
criterion = "0.5"

[features]
default = []
blocking = ["reqwest/blocking"]

[[bench]]
name = "client_benchmark"
harness = false
